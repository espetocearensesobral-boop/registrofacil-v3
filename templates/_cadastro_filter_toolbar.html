<div class="filter-bar cadastro-filter-surface">
    <form method="get" action="{{ url_for(cadastro_endpoint) }}" class="cadastro-filter-toolbar" id="{{ cadastro_tipo }}-filter-form">
        <input type="hidden" name="ordenar" value="{{ ordenar | default('nome') }}">
        <input type="hidden" name="direcao" value="{{ direcao | default('asc') }}">
        <div class="cadastro-filter-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="text"
                   name="busca"
                   id="{{ cadastro_tipo }}-busca"
                   placeholder="Nome, e-mail ou telefone..."
                   value="{{ busca | default('') }}"
                   autocomplete="off"
                   aria-label="Buscar {{ cadastro_label | lower }}">
        </div>
        <select name="registros_por_pagina"
                id="{{ cadastro_tipo }}-registros-por-pagina"
                class="cadastro-filter-select"
                aria-label="Registros por página">
            {% for n in [10, 25, 50, 100] %}
            <option value="{{ n }}" {% if registros_por_pagina == n %}selected{% endif %}>{{ n }} por página</option>
            {% endfor %}
        </select>
        <button type="submit"
                class="cadastro-filter-icon-btn cadastro-filter-apply-btn"
                title="Aplicar filtros"
                aria-label="Aplicar filtros">
            <i class="bi bi-funnel" aria-hidden="true"></i>
        </button>
        <a href="{{ url_for(cadastro_endpoint) }}"
           class="cadastro-filter-icon-btn cadastro-filter-clear-btn"
           title="Limpar filtros"
           aria-label="Limpar filtros">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </a>
    </form>
</div>
