<div class="filter-bar admin-filter-surface">
    <form method="get" action="{{ url_for('admin_users.users_list') }}" class="admin-filter-toolbar" id="users-filter-form">
        <select name="status" id="usuarios-status" class="admin-filter-select" aria-label="Filtrar por status">
            <option value="ativo" {% if filtro_status == 'ativo' %}selected{% endif %}>Status: Ativos</option>
            <option value="inativo" {% if filtro_status == 'inativo' %}selected{% endif %}>Status: Inativos</option>
            <option value="todos" {% if filtro_status == 'todos' %}selected{% endif %}>Status: Todos</option>
        </select>
        <div class="admin-filter-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="text" name="busca" id="usuarios-busca" value="{{ filtro_busca | default('') }}" placeholder="Usuário, nome ou e-mail..." autocomplete="off" aria-label="Buscar usuário">
        </div>
        <button type="submit" class="admin-filter-icon-btn admin-filter-apply-btn" title="Aplicar filtros" aria-label="Aplicar filtros">
            <i class="bi bi-funnel" aria-hidden="true"></i>
        </button>
        <a href="{{ url_for('admin_users.users_list') }}" class="admin-filter-icon-btn admin-filter-clear-btn" title="Limpar filtros" aria-label="Limpar filtros">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </a>
    </form>
</div>
