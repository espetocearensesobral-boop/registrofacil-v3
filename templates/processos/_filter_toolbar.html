<div class="filter-bar process-filter-surface">
    <form method="get" action="{{ request.path }}" class="process-filter-toolbar" id="process-filter-form">
        <div class="process-filter-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="text" name="busca" id="busca" placeholder="ID, titular, matrícula ou outros dados..." value="{{ filtro_busca | default('') }}" autocomplete="off">
        </div>
        <select name="status" id="status" class="process-filter-select" aria-label="Filtrar por status">
            <option value="">Status: Todos</option>
            {% for status in status_list %}<option value="{{ status.id }}" {% if filtro_status_id == status.id %}selected{% endif %}>{{ status.nome }}</option>{% endfor %}
        </select>
        <select name="tipo" id="tipo" class="process-filter-select" aria-label="Filtrar por tipo de serviço">
            <option value="">Serviço: Todos</option>
            {% for tipo in tipos_servico %}<option value="{{ tipo.id }}" {% if filtro_tipo == tipo.id %}selected{% endif %}>{{ tipo.nome }}</option>{% endfor %}
        </select>
        <select name="envolve_notas" id="envolve_notas" class="process-filter-select" aria-label="Filtrar por envolvimento de notas">
            <option value="">Notas: Todos</option>
            <option value="1" {% if filtro_envolve_notas == 1 %}selected{% endif %}>Notas: Sim</option>
            <option value="0" {% if filtro_envolve_notas == 0 %}selected{% endif %}>Notas: Não</option>
        </select>
        <div class="process-filter-more-wrap">
            <button type="button" class="process-filter-icon-btn process-filter-more-btn" id="process-filter-more" title="Mais filtros" aria-label="Mais filtros" aria-expanded="false" aria-controls="process-filter-popover"><i class="bi bi-three-dots-vertical" aria-hidden="true"></i><span class="process-filter-badge" id="process-filter-badge" aria-hidden="true">0</span></button>
            <div class="process-filter-popover" id="process-filter-popover" hidden>
                <div class="process-filter-date-row">
                    <div><label for="data_inicio">Data inicial</label><input type="date" name="data_inicio" id="data_inicio" value="{{ filtro_data_inicio | default('') }}"></div>
                    <div><label for="data_fim">Data final</label><input type="date" name="data_fim" id="data_fim" value="{{ filtro_data_fim | default('') }}"></div>
                </div>
                <label for="ordenar">Ordenar por</label>
                <select name="ordenar" id="ordenar">
                    <option value="id_desc" {% if ordenar == 'id_desc' %}selected{% endif %}>ID mais recente</option>
                    <option value="id_asc" {% if ordenar == 'id_asc' %}selected{% endif %}>ID mais antigo</option>
                    <option value="data_entrada_desc" {% if ordenar == 'data_entrada_desc' %}selected{% endif %}>Entrada mais recente</option>
                    <option value="data_entrada_asc" {% if ordenar == 'data_entrada_asc' %}selected{% endif %}>Entrada mais antiga</option>
                    <option value="titular_asc" {% if ordenar == 'titular_asc' %}selected{% endif %}>Titular (A–Z)</option>
                    <option value="titular_desc" {% if ordenar == 'titular_desc' %}selected{% endif %}>Titular (Z–A)</option>
                    <option value="status_asc" {% if ordenar == 'status_asc' %}selected{% endif %}>Status (A–Z)</option>
                    <option value="status_desc" {% if ordenar == 'status_desc' %}selected{% endif %}>Status (Z–A)</option>
                    <option value="prazo_asc" {% if ordenar == 'prazo_asc' %}selected{% endif %}>Prazo crescente</option>
                    <option value="prazo_desc" {% if ordenar == 'prazo_desc' %}selected{% endif %}>Prazo decrescente</option>
                </select>
                <label for="registros_por_pagina">Registros por página</label>
                <select name="registros_por_pagina" id="registros_por_pagina">
                    <option value="10" {% if registros_por_pagina == 10 %}selected{% endif %}>10</option><option value="25" {% if registros_por_pagina == 25 %}selected{% endif %}>25</option><option value="50" {% if registros_por_pagina == 50 %}selected{% endif %}>50</option><option value="100" {% if registros_por_pagina == 100 %}selected{% endif %}>100</option>
                </select>
            </div>
        </div>
        <button type="submit" class="process-filter-icon-btn process-filter-apply-btn" title="Aplicar filtros" aria-label="Aplicar filtros"><i class="bi bi-funnel" aria-hidden="true"></i></button>
        <a href="{{ request.path }}" class="process-filter-icon-btn process-filter-clear-btn" title="Limpar filtros" aria-label="Limpar filtros"><i class="bi bi-x-lg" aria-hidden="true"></i></a>
    </form>
</div>

<script>
(function () {
    function updateProcessFilterBadge() {
        const badge = document.getElementById('process-filter-badge');
        if (!badge) return;
        const ids = ['data_inicio', 'data_fim', 'ordenar', 'registros_por_pagina'];
        const count = ids.reduce((total, id) => {
            const field = document.getElementById(id);
            if (!field) return total;
            if (id === 'ordenar' && field.value === 'id_desc') return total;
            if (id === 'registros_por_pagina' && field.value === '10') return total;
            return total + (field.value ? 1 : 0);
        }, 0);
        badge.textContent = count;
        badge.classList.toggle('on', count > 0);
    }
    document.addEventListener('click', function (event) {
        const moreButton = event.target.closest('#process-filter-more');
        const popover = document.getElementById('process-filter-popover');
        if (moreButton && popover) {
            event.preventDefault();
            const isOpen = !popover.hidden;
            popover.hidden = isOpen;
            moreButton.setAttribute('aria-expanded', String(!isOpen));
            updateProcessFilterBadge();
            return;
        }
        if (popover && !popover.hidden && !event.target.closest('.process-filter-more-wrap')) {
            popover.hidden = true;
            const button = document.getElementById('process-filter-more');
            if (button) button.setAttribute('aria-expanded', 'false');
        }
    });
    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        const popover = document.getElementById('process-filter-popover');
        const button = document.getElementById('process-filter-more');
        if (popover && !popover.hidden) {
            popover.hidden = true;
            if (button) { button.setAttribute('aria-expanded', 'false'); button.focus(); }
        }
    });
    document.addEventListener('DOMContentLoaded', updateProcessFilterBadge);
    updateProcessFilterBadge();
})();
</script>
